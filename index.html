<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Love Forever</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  background: #000;
  height: 100vh;
  margin: 0;
  overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

/* 🔴 النص العربي (تم تعديله) */
.center-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:red;
font-size:20px;
text-align:center;
text-shadow:0 0 10px #fff, 0 0 20px red;
letter-spacing:2px;
z-index:1000;
animation:pulse 2s infinite ease-in-out;
width:300px;
}

/* روابط */
.quick-link {
  position: fixed;
  right: 10px;
  width: 35px;
  height: 35px;
  z-index: 999;
  background: #696969;
  border-radius: 50%;
  text-align: center;
  color: #ddd;
  text-decoration: none;
  line-height: 35px;
  font-size: 13px;
}

.quick-link:nth-of-type(1) { top: 10%; }
.quick-link:nth-of-type(2) { top: 4%; }
.quick-link:nth-of-type(3) { top: 16%; }
.quick-link:nth-of-type(4) { top: 22%; }

/* القلب */
#ui .love {
  position: absolute;
  top: 50%;
  left: 50%;
  margin: -200px 0 0 -200px;
  --i: 1;
}

#ui .love_word {
  color: #ea80b0;
  font-size: 1.4rem;
  transform: translateY(-100%) rotateZ(-30deg);
  text-shadow: 0 0 10px #fff;
  letter-spacing: 2px;
}

#ui .love_horizontal {
  animation: horizontal 10000ms infinite alternate ease-in-out;
  animation-delay: calc(var(--i) * -300ms);
}

#ui .love_vertical {
  animation: vertical 20000ms infinite linear;
  animation-delay: calc(var(--i) * -300ms);
}

/* حركة النص */
@keyframes pulse{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.1);}
100%{transform:translate(-50%,-50%) scale(1);}
}

@keyframes horizontal {
  from { transform: translateX(0px); }
  to   { transform: translateX(450px); }
}

@keyframes vertical {
  0% { transform: translateY(180px); }
  50% { transform: translateY(450px); }
  100% { transform: translateY(180px); }
}
</style>
</head>

<body>

<a href="#" class="quick-link">1</a>
<a href="#" class="quick-link">2</a>
<a href="#" class="quick-link">3</a>
<a href="#" class="quick-link">4</a>

<div id="ui"></div>

<!-- 🔴 النص داخل القلب -->
<div class="center-text">
ظنيتك مطر<br>
وأترجى منك فيض<br>
ما ادري برصاص غيّومك<br>
مرعدة
</div>

<script>
const N = 70;
const ui = document.getElementById('ui');

for (let i = 1; i <= N; i++) {
  const love = document.createElement('div');
  love.className = 'love';
  love.style.setProperty('--i', i);

  const h = document.createElement('div');
  h.className = 'love_horizontal';

  const v = document.createElement('div');
  v.className = 'love_vertical';

  const word = document.createElement('div');
  word.className = 'love_word';
  word.textContent = 'I love you';

  v.appendChild(word);
  h.appendChild(v);
  love.appendChild(h);
  ui.appendChild(love);
}
</script>

</body>
</html>
